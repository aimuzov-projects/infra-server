# Единственное, что слушает 80/443 на сервере. Проекты порты не публикуют:
# они подключаются к сети edge, и Caddy ходит к ним по имени контейнера.
# Те, кому нужен выход в интернет через VPN, подключаются ещё и к сети vpn (см. README).

name: infra

services:
  caddy:
    image: caddy:2.10-alpine
    container_name: caddy
    restart: unless-stopped
    # Хеши паролей для sites/*.caddy ({$VAR}). Передаём поштучно, чтобы остальной .env
    # в Caddy не попадал. Без хеша ":?" роняет compose и продолжает работать старый Caddy,
    # а не поднимается редактор без пароля.
    environment:
      TAPLIST_EDITOR_HASH: ${TAPLIST_EDITOR_HASH:?TAPLIST_EDITOR_HASH is not set, see .env.example}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sites:/etc/caddy/sites:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '2'

  # Выход в интернет через VPN для проектов: HTTP-прокси vpn:3128 и SOCKS vpn:1080 в сети vpn.
  # Конфиг собирает vpn/update.sh из подписки, сам файл в git не попадает.
  vpn:
    image: ghcr.io/xtls/xray-core:26.10.21
    container_name: vpn
    restart: unless-stopped
    command: ['run', '-c', '/etc/xray/config.json']
    volumes:
      - ./vpn/config.json:/etc/xray/config.json:ro
    networks:
      - vpn
    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '2'

volumes:
  caddy_data:
  caddy_config:

networks:
  edge:
    name: edge
    external: true
  vpn:
    name: vpn
    external: true
