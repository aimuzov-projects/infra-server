name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Выкладки идут по очереди, новая не обрывает уже начатую.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck deploy/remote.sh vpn/update.sh
      # Тот же образ, что в compose.yml: битый конфиг не доедет до сервера.
      - run: >-
          docker run --rm
          -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro"
          -v "$PWD/sites:/etc/caddy/sites:ro"
          caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile

  deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Сервер сам знает, что делать: ключ в authorized_keys привязан к deploy/remote.sh,
      # поэтому команду ssh не передаём.
      - name: Deploy on server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOST: '185.219.43.208 ssh-rsa '
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOST" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes root@185.219.43.208
