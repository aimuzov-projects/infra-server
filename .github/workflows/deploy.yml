name: Deploy

on:
  push:
    branches: [main]
  # Только проверки: деплой пропускается, да и PR из форков секретов всё равно не получают.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck deploy/remote.sh deploy/site.sh deploy/site-build.sh vpn/update.sh
      # Тот же образ, что в compose.yml, чтобы сломанный конфиг не доехал до сервера.
      # Хеш одноразовый: настоящий секрет живёт только в .env на сервере.
      - run: >-
          docker run --rm
          -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro"
          -v "$PWD/sites:/etc/caddy/sites:ro"
          caddy:2.10-alpine sh -c
          'TAPLIST_EDITOR_HASH="$(caddy hash-password --plaintext ci)"
          caddy validate --config /etc/caddy/Caddyfile'

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    # Деплои идут по одному, новый не обрывает уже запущенный.
    # Очередь на уровне джобы, поэтому проверки PR не ждут, пока закончится деплой.
    concurrency:
      group: deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Сервер сам знает, что делать: ключ в authorized_keys привязан к deploy/remote.sh,
      # поэтому команду в ssh не передаём.
      - name: Deploy on server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOST: '185.219.43.208 ssh-rsa '
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOST" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes root@185.219.43.208
