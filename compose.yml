# The only thing listening on 80/443 on the server. Projects don't publish ports:
# they join the edge network and Caddy reaches them by container name. Those that need
# to go out to the internet through the VPN also join the vpn network (see README).

name: infra

services:
  caddy:
    image: caddy:2.10-alpine
    container_name: caddy
    restart: unless-stopped
    # Password hashes for sites/*.caddy ({$VAR}), passed one by one so the rest of .env
    # never reaches Caddy. Without a hash ":?" fails compose and the old Caddy keeps
    # running, instead of serving the editor with no password.
    environment:
      TAPLIST_EDITOR_HASH: ${TAPLIST_EDITOR_HASH:?TAPLIST_EDITOR_HASH is not set, see .env.example}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sites:/etc/caddy/sites:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '2'

  # VPN egress for projects: HTTP proxy vpn:3128 and SOCKS vpn:1080 on the vpn network.
  # vpn/update.sh builds the config from the subscription, the file itself stays out of git.
  vpn:
    image: ghcr.io/xtls/xray-core:26.9.9
    container_name: vpn
    restart: unless-stopped
    command: ['run', '-c', '/etc/xray/config.json']
    volumes:
      - ./vpn/config.json:/etc/xray/config.json:ro
    networks:
      - vpn
    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '2'

volumes:
  caddy_data:
  caddy_config:

networks:
  edge:
    name: edge
    external: true
  vpn:
    name: vpn
    external: true
