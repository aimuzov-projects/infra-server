version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  # caddy and xray images in compose.yml. The caddy tag in deploy.yml is a plain string
  # in a run step, Dependabot won't see it: bump it by hand in the same PR.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
