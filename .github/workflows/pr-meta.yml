name: PR meta

# Назначает PR и вешает метки по его заголовку,
# сама логика живёт в aimuzov/.github.
# pull_request_target нужен, чтобы у PR от Renovate был токен с правом записи.
# Ничего из PR при этом не чекаутится и не запускается.
on:
  pull_request_target:
    types: [opened, reopened, edited]

permissions:
  pull-requests: write
  issues: write

jobs:
  meta:
    uses: aimuzov/.github/.github/workflows/pr-meta.yml@main
