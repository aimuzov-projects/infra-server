name: Deploy

on:
  push:
    branches: [main]
  # Only the checks: deploy is skipped, and fork PRs don't get secrets anyway.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck deploy/remote.sh deploy/site.sh deploy/site-build.sh vpn/update.sh
      # Same image as in compose.yml, so a broken config never reaches the server.
      # The hash is a throwaway one: the real secret lives only in the server's .env.
      - run: >-
          docker run --rm
          -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro"
          -v "$PWD/sites:/etc/caddy/sites:ro"
          caddy:2.10-alpine sh -c
          'TAPLIST_EDITOR_HASH="$(caddy hash-password --plaintext ci)"
          caddy validate --config /etc/caddy/Caddyfile'

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    # Deploys run one at a time, a new one doesn't cut off one already in progress.
    # The queue is per job, so PR checks don't wait behind a deploy.
    concurrency:
      group: deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The server knows what to do: the key in authorized_keys is bound to deploy/remote.sh,
      # so we don't pass a command to ssh.
      - name: Deploy on server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOST: '185.219.43.208 ssh-rsa '
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOST" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes root@185.219.43.208
